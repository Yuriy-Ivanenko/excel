<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Візуальний тренажер: посилання в таблицях</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1f2a24;--mu:#5c6b62;--ac:#1d7a4f;--acbg:#e3f3ea;--er:#b3261e;--erbg:#fbe9e7;--bd:#d5dbd6;--b0:#cfe3ff;--b1:#ffd9a8;--sr:#fff3a6;--hd:#e9eee9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2621;--tx:#e8eee9;--mu:#9fb0a5;--ac:#4cc58a;--acbg:#21382c;--er:#ff8a80;--erbg:#3a2220;--bd:#34413a;--b0:#1e3f6b;--b1:#6b4512;--sr:#5c5314;--hd:#27322b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d2621;--tx:#e8eee9;--mu:#9fb0a5;--ac:#4cc58a;--acbg:#21382c;--er:#ff8a80;--erbg:#3a2220;--bd:#34413a;--b0:#1e3f6b;--b1:#6b4512;--sr:#5c5314;--hd:#27322b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.25rem;margin:0 0 2px}.sub{color:var(--mu);margin:0 0 12px;font-size:.9rem}
.dots{display:flex;gap:6px;margin-bottom:10px}.dots i{flex:1;height:8px;border-radius:4px;background:var(--bd)}.dots i.on{background:var(--ac)}.dots i.cur{background:var(--b1)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h2{font-size:1.05rem;margin:0 0 6px}
.fx{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin:10px 0 0;font-family:ui-monospace,Consolas,monospace;min-height:38px;background:var(--card)}
.fx b{color:var(--mu);font-style:italic;font-family:serif}
.fx span.r0,.fx span.r1{padding:1px 4px;border-radius:4px}
.r0{background:var(--b0)}.r1{background:var(--b1)}
.scroll{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;margin:0 auto}
td,th{border:1px solid var(--bd);padding:5px 6px;text-align:center;min-width:58px;height:32px}
th{background:var(--hd);color:var(--mu);font-weight:600;font-size:.8rem}
td.c{cursor:pointer;transition:background .2s}
td.t{font-family:system-ui,sans-serif;font-size:.8rem;background:var(--hd)}
td.r0{background:var(--b0)}td.r1{background:var(--b1)}
td.sel{outline:3px solid var(--ac);outline-offset:-3px;background:var(--sr)}
td.bad{background:var(--erbg);color:var(--er);font-weight:700}
td.fl{animation:p .5s}@keyframes p{from{transform:scale(1.25);background:var(--sr)}}
.hint{color:var(--mu);font-size:.82rem;text-align:center;margin:0}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-family:ui-monospace,Consolas,monospace;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--acbg)}.opt.ok{border-color:var(--ac);background:var(--acbg)}.opt.bad{border-color:var(--er);background:var(--erbg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;padding:8px;border:2px solid var(--bd);border-radius:10px}
.row.ok{border-color:var(--ac);background:var(--acbg)}.row.bad{border-color:var(--er);background:var(--erbg)}
.row .d{flex:1;min-width:180px}
.ref{font:700 1.3rem ui-monospace,Consolas,monospace;display:flex;align-items:center;gap:2px}
.chip{width:34px;height:34px;border-radius:8px;border:2px dashed var(--mu);background:var(--card);color:var(--tx);font:700 1rem ui-monospace,monospace;cursor:pointer}
.chip.on{border:2px solid var(--ac);background:var(--acbg);color:var(--ac)}
.cp{font-size:.8rem;color:var(--mu);width:100%}
.btn{margin-top:10px;padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0b1a12}
.btn:disabled{opacity:.5}
.fb{margin-top:12px;padding:12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--acbg);border-left:4px solid var(--ac)}.fb.er{background:var(--erbg);border-left:4px solid var(--er)}.fb p{margin:3px 0}
.big{font-size:2rem;font-weight:700;color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>Візуальний тренажер: адресація в таблицях</h1>
<p class="sub">9 клас · абсолютні та мішані посилання · копіювання формул</p>
<div class="dots" id="dots"></div>
<div id="app"></div>
</main>
<script>
var L="ABCDEFG";
function sh(f,dc,dr){return f.replace(/(\$?)([A-G])(\$?)(\d+)/g,function(m,a,c,b,r){return a+(a?c:L[L.indexOf(c)+dc])+b+(b?r:+r+dr)})}
function pa(a){return[L.indexOf(a[0]),+a.slice(1)]}
function ad(c,r){return L[c]+r}
var T=[
{k:"toggle",title:"Закріпи посилання",q:"Клацайте кнопки перед літерою та цифрою, щоб додати або прибрати знак $. Зробіть посилання на клітинку C5 потрібного виду."},
{k:"res",title:"Копіювання відносного посилання",q:"У C2 записано формулу =A2*B2. Її копіюють униз до C4. Яка формула буде в C4?",
 nc:3,nr:4,cells:{A1:{v:"К-сть",t:1},B1:{v:"Ціна",t:1},C1:{v:"Вартість",t:1},A2:{v:3},B2:{v:20},A3:{v:5},B3:{v:15},A4:{v:2},B4:{v:40}},src:"C2",sf:"=A2*B2",rng:"C4",tgt:"C4",
 opts:[["=A2*B2","Так було б, якби посилання були абсолютними ($A$2*$B$2). Тут вони відносні — тож зсуваються."],
 ["=A4*B4","Копіювання на 2 рядки вниз: у ВСІХ відносних посиланнях номер рядка збільшується на 2 (A2→A4, B2→B4)."],
 ["=A4*B2","Відносні посилання змінюються разом — друге теж зсувається."],
 ["=A2*B4","Відносні посилання змінюються разом — перше теж зсувається."]]},
{k:"bld",title:"Коли потрібне абсолютне посилання",q:"У E1 — курс долара, в A3:A6 — суми в USD. У B3 вводять формулу, яку потім копіюють униз до B6. Яку формулу введемо в B3? Після перевірки побачите, що станеться при копіюванні.",
 nc:5,nr:6,cells:{D1:{v:"Курс:",t:1},E1:{v:41},A2:{v:"USD",t:1},B2:{v:"UAH",t:1},A3:{v:10},A4:{v:25},A5:{v:40},A6:{v:100}},src:"B3",rng:"B6",
 opts:[["=A3*E1",0,"Курс E1 «поїхав» вниз: у B4 вийшло =A4*E2 — порожня клітинка, тому 0."],
 ["=A3*$E$1",1,"Сума A3 зсувається (відносне), а курс $E$1 завжди той самий (абсолютне)."],
 ["=$A$3*E1",0,"Навпаки: сума закріплена, курс зсувається. Результат хибний."],
 ["=$A$3*$E$1",0,"Усе закріплено — кожен рядок множить A3 на курс, тобто однакові числа."]]},
{k:"res",title:"Мішані посилання: прогноз",q:"У C2 записано =$A2+B$1. Формулу скопіювали в D3 (на 1 стовпець праворуч і на 1 рядок вниз). Яка формула буде в D3?",
 nc:4,nr:3,cells:{B1:{v:5},C1:{v:7},D1:{v:9},A2:{v:10},A3:{v:20}},src:"C2",sf:"=$A2+B$1",rng:"D3",tgt:"D3",
 opts:[["=$A3+C$1","$A2: стовпець закріплено, рядок 2→3 = $A3. B$1: рядок закріплено, стовпець B→C = C$1."],
 ["=$A2+B$1","Так було б для $A$2+$B$1. Мішані посилання частково змінюються — те, що без $."],
 ["=$B3+C$1","Стовпець A закріплено знаком $ — він не може стати B."],
 ["=$A3+B$2","У B$1 закріплено рядок 1 (він не стане 2). Змінюється стовпець: B→C."]]},
{k:"bld",title:"Таблиця множення",q:"Числа 1–5 записані в A2:A6 та B1:F1. В B2 вводимо одну формулу й копіюємо на весь діапазон B2:F6. Яка формула потрібна?",
 nc:6,nr:6,cells:{A1:{v:"×",t:1},B1:{v:1},C1:{v:2},D1:{v:3},E1:{v:4},F1:{v:5},A2:{v:1},A3:{v:2},A4:{v:3},A5:{v:4},A6:{v:5}},src:"B2",rng:"F6",
 opts:[["=A2*B1",0,"Усе відносне: у C2 вийде =B2*C1 — множник зсунувся з заголовка."],
 ["=$A2*B$1",1,"$A2 — завжди множник зі стовпця A; B$1 — завжди з рядка 1. Клацніть будь-яку клітинку й перевірте!"],
 ["=A$2*$B1",0,"Закріплення переплутано: рядок 2 і стовпець B — не заголовки."],
 ["=$A$2*$B$1",0,"Усе закріплено: всі клітинки однакові."]]}
];
var TG=[["Абсолютне посилання (не змінюється ніколи)",1,1],["Мішане: закріплено лише стовпець",1,0],["Мішане: закріплено лише рядок",0,1],["Відносне посилання (змінюється повністю)",0,0]];
var i=0,pts=0,done=[],tries=0,sel=-1,busy=0,S,tg,app=document.getElementById("app");
function val(a){var c=S.cells[a];if(!c)return"";if(c.f)return ev(c.f);return c.v}
function ev(f){try{var r=Function("return "+f.slice(1).replace(/\$?([A-G])\$?(\d+)/g,function(m,c,r){var v=val(c+r);return v===""||isNaN(v)?0:v}))();return Math.round(r*100)/100}catch(e){return"#ПОМ"}}
function refs(f){var o=[],m,re=/\$?([A-G])\$?(\d+)/g;while(m=re.exec(f))o.push(m[1]+m[2]);return o}
function fxHtml(f){var n=0;return f.replace(/\$?[A-G]\$?\d+/g,function(m){return'<span class="r'+(n++%2)+'">'+m+"</span>"})}
function dots(){document.getElementById("dots").innerHTML=T.map(function(_,k){return"<i class='"+(k<i?"on":k==i?"cur":"")+"'></i>"}).join("")}
function grid(){
 var t=T[i],sf=S.sel&&S.cells[S.sel]&&S.cells[S.sel].f,hl={};
 if(sf)refs(sf).forEach(function(a,n){hl[a]="r"+(n%2)});
 var h='<div class="fx"><b>fx</b><span>'+(sf?fxHtml(sf):(S.sel?(val(S.sel)===""?"":val(S.sel)):"—"))+"</span></div><div class='scroll'><table><tr><th></th>";
 for(var c=0;c<t.nc;c++)h+="<th>"+L[c]+"</th>";h+="</tr>";
 for(var r=1;r<=t.nr;r++){h+="<tr><th>"+r+"</th>";for(var c=0;c<t.nc;c++){var a=ad(c,r),ce=S.cells[a],v=val(a);
  if(S.q&&a==t.src&&!ce)v="?";
  var cl="c"+(ce&&ce.t?" t":"")+(hl[a]?" "+hl[a]:"")+(S.sel==a?" sel":"")+(S.bad[a]?" bad":"")+(S.fl==a?" fl":"");
  h+="<td class='"+cl+"' onclick='cs(\""+a+"\")'>"+v+"</td>"}h+="</tr>"}
 return h+"</table></div><p class='hint'>Клацніть клітинку з формулою — побачите, на які клітинки вона посилається</p>";
}
function cs(a){if(busy)return;S.sel=a;S.fl=0;draw()}
function draw(){document.getElementById("gr").innerHTML=grid()}
function reset(){var t=T[i];S={cells:JSON.parse(JSON.stringify(t.cells)),sel:t.src,bad:{},q:t.k=="bld"};if(t.k=="res")S.cells[t.src]={f:t.sf}}
function render(){
 if(i>=T.length)return fin();
 var t=T[i];tries=0;sel=-1;busy=0;dots();
 var h='<div class="card"><h2>'+(i+1)+". "+t.title+"</h2><p>"+t.q+"</p>";
 if(t.k=="toggle"){tg=TG.map(function(){return[0,0]});h+="<div id='tg'></div>"}
 else{reset();h+='<div id="gr"></div>';t.opts.forEach(function(o,k){h+='<button class="opt" onclick="pick('+k+')" id="o'+k+'">'+o[0]+"</button>"})}
 h+='<button class="btn" id="chk" onclick="check()">Перевірити</button><div id="fb"></div></div>';
 app.innerHTML=h;if(t.k=="toggle")tgDraw();else draw();
}
function tgDraw(){
 document.getElementById("tg").innerHTML=TG.map(function(r,k){var a=tg[k],ref=(a[0]?"$":"")+"C"+(a[1]?"$":"")+"5",cp=sh(ref,2,2);
  return'<div class="row" id="tr'+k+'"><div class="d">'+r[0]+'</div><div class="ref"><button class="chip'+(a[0]?" on":"")+'" onclick="tt('+k+',0)">'+(a[0]?"$":"·")+"</button>C<button class='chip"+(a[1]?" on":"")+"' onclick='tt("+k+",1)'>"+(a[1]?"$":"·")+"</button>5</div><div class='cp'>Ваше: <b>"+ref+"</b> → після копіювання на 2 стовпці праворуч і 2 рядки вниз: <b>"+cp+"</b></div></div>"}).join("")}
function tt(k,j){if(document.getElementById("chk").dataset.d)return;tg[k][j]^=1;tgDraw()}
function pick(k){if(busy||document.getElementById("chk").dataset.d)return;sel=k;T[i].opts.forEach(function(_,j){document.getElementById("o"+j).className="opt"+(j==k?" sel":"")})}
function fill(f,done,sl){
 var t=T[i],a=pa(t.src),b=pa(t.rng),L2=[];
 for(var r=a[1];r<=b[1];r++)for(var c=a[0];c<=b[0];c++)L2.push([c,r]);
 busy=1;S.q=0;var n=0;(function st(){
  if(n>=L2.length){busy=0;return done()}
  var p=L2[n++],ad_=ad(p[0],p[1]);S.cells[ad_]={f:sh(f,p[0]-a[0],p[1]-a[1])};if(sl)return st();S.sel=ad_;S.fl=ad_;draw();setTimeout(st,n==1?200:320)})();
}
function ok(first,msg){
 if(first)pts++;done[i]=first;
 document.getElementById("fb").innerHTML='<div class="fb ok"><p><b>'+(first?"Правильно!":"Правильно (не з першої спроби)")+"</b></p>"+msg+"</div>";
 var b=document.getElementById("chk");b.disabled=0;b.dataset.d=1;b.textContent=i<T.length-1?"Далі →":"Результат";b.onclick=function(){i++;render()}}
function er(msg){document.getElementById("fb").innerHTML='<div class="fb er"><p><b>Поки що неправильно.</b></p>'+msg+"<p>Спробуйте ще раз.</p></div>";document.getElementById("chk").disabled=0}
function check(){
 var t=T[i];if(busy)return;
 if(t.k=="toggle"){tries++;var n=0,m="";
  TG.forEach(function(r,k){var good=tg[k][0]==r[1]&&tg[k][1]==r[2],e=document.getElementById("tr"+k);e.className="row "+(good?"ok":"bad");if(good)n++});
  if(n==4)return ok(tries==1,"<p>$ перед літерою закріплює стовпець, $ перед цифрою — рядок. Дивіться на результат копіювання: закріплене не змінюється.</p>");
  return er("<p>Неправильних рядків: "+(4-n)+" (виділені червоним). Підказка: що саме не змінилось у «Після копіювання»?</p>")}
 if(sel<0){document.getElementById("fb").innerHTML='<div class="fb er">Спочатку оберіть відповідь.</div>';return}
 tries++;var o=t.opts[sel],btn=document.getElementById("chk");btn.disabled=1;
 if(t.k=="res"){var g=o[0]==sh(t.sf,pa(t.tgt)[0]-pa(t.src)[0],pa(t.tgt)[1]-pa(t.src)[1]);
  document.getElementById("o"+sel).className="opt "+(g?"ok":"bad");
  if(!g){btn.disabled=0;return er("<p>"+o[1]+"</p>")}
  return fill(t.sf,function(){ok(tries==1,"<p>"+o[1]+"</p><p>Клацніть на клітинки — кольори покажуть, звідки береться кожне значення.</p>")})}
 reset();draw();var f=o[0],good=!!o[1];
 var ref={},rf=t.opts.filter(function(x){return x[1]})[0][0];
 var tmp=S.cells;S.cells=JSON.parse(JSON.stringify(tmp));
 fill(rf,function(){var ex={};for(var a in S.cells)ex[a]=val(a);S.cells=tmp;S.bad={};S.sel=t.src;
  document.getElementById("o"+sel).className="opt "+(good?"ok":"bad");
  fill(f,function(){var nb=0;for(var a in ex){if(S.cells[a]&&S.cells[a].f&&val(a)!==ex[a]){S.bad[a]=1;nb++}}draw();
   if(good)ok(tries==1,"<p>"+o[2]+"</p><p>Клацніть будь-яку клітинку результату — кольори покажуть її посилання.</p>");
   else er("<p>"+o[2]+"</p><p>Клітинки з хибним результатом позначено червоним.</p>")})},1)
}
function fin(){
 dots();var p=pts/T.length,m=p==1?"Відмінно! Ви впевнено працюєте з посиланнями.":p>=.6?"Добре! Повторіть теми з помилками.":"Варто повторити відносні, абсолютні й мішані посилання.";
 var h='<div class="card"><h2>Результат</h2><div class="big">'+pts+" / "+T.length+"</div><p>"+m+"</p><ul>";
 T.forEach(function(t,k){h+="<li>"+(done[k]?"✔":"✘")+" "+t.title+(done[k]?"":" — потребує повторення")+"</li>"});
 app.innerHTML=h+'</ul><p class="hint">Порада: у програмі клавіша F4 перемикає вид посилання під час введення формули.</p><button class="btn" onclick="i=0;pts=0;done=[];render()">Пройти ще раз</button></div>'}
render();
</script>
</body>
</html>
